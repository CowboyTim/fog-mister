<text x="560" y="924" class="p" text-anchor="start">All ground symbols are one common ground: 12 V supply −, buck, ESP32, MOSFET VIN−, MAX3485.</text>
<text x="560" y="944" class="p" text-anchor="start">+12V flags all connect to the 12 V supply's + output. The ultrasonic mister's DC side stays isolated behind the SSR.</text>
<text x="560" y="964" class="p" text-anchor="start">10 kΩ pull-downs keep the MOSFETs off while the ESP32 boots. Diode band (cathode) to blower +.</text>
<text x="560" y="984" class="p" text-anchor="start">Fog machine stand: horizontal, 50 cm clear around vents, 5 cm gap from nozzle to the duct.</text>
