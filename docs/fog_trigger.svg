<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540">
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#1d1d1f}
.t{font-size:15px;font-weight:bold}
.s{font-size:11.5px;fill:#555}
.p{font-size:11px;fill:#333}
.n{font-size:11px;fill:#666;font-style:italic}
.h{font-size:22px;font-weight:bold}
.box{fill:#f6f7f9;stroke:#333;stroke-width:1.5}
.mcu{fill:#e9f1fb;stroke:#2b5aa0;stroke-width:2}
.dev{fill:#fff6e8;stroke:#a86a10;stroke-width:1.5}
.w{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.mains{stroke:#8b4513;stroke-width:3.5;stroke-dasharray:10 5}
.v12{stroke:#d22}
.v5{stroke:#e07b00}
.v33{stroke:#1a7fd4}
.sig{stroke:#1d9a4a}
.dmx{stroke:#7b3fbf}
.iso{stroke:#c2187a}
.gnd{stroke:#222}
.c{fill:none;stroke:#222;stroke-width:1.6}
.cable{fill:none;stroke:#7b3fbf;stroke-width:1;stroke-dasharray:4 3}
</style>
<rect width="920" height="540" fill="#fff"/>
<text x="24" y="36" class="h" text-anchor="start">Fogbox trigger node (fog_trigger)</text>
<g transform="translate(0,30)">
<rect x="40" y="60" width="150" height="80" rx="6" class="dev"/>
<text x="115.0" y="82" class="t" text-anchor="middle">USB power bank</text>
<text x="115.0" y="99" class="s" text-anchor="middle">no auto-off at ~80 mA</text>
<rect x="320" y="60" width="220" height="330" rx="6" class="mcu"/>
<text x="430.0" y="82" class="t" text-anchor="middle">ESP32-C3</text>
<text x="430.0" y="99" class="s" text-anchor="middle">trigger node</text>
<text x="430" y="130" class="s" text-anchor="middle">Wi-Fi STA on ch 1, not joined</text>
<text x="430" y="146" class="s" text-anchor="middle">ESP-NOW → controller</text>
<text x="430" y="162" class="s" text-anchor="middle">100–200 m in woods</text>
<text x="430" y="190" class="s" text-anchor="middle">GPIO8: on-board LED</text>
<text x="430" y="206" class="s" text-anchor="middle">blip = link OK, 2 Hz = no link</text>
<text x="430" y="222" class="s" text-anchor="middle">on 1.5 s = confirmed</text>
<text x="430" y="238" class="s" text-anchor="middle">3 long flashes = not confirmed</text>
<circle cx="320" cy="100" r="2.8" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="327" y="104" class="p" text-anchor="start">USB</text>
<polyline points="190,100 320,100" class="w v5"/>
<text x="255" y="92" class="n" text-anchor="middle">USB 5 V</text>
<path d="M540,90 H580 V60 M568,48 L580,60 L592,48" class="c"/>
<text x="600" y="58" class="s" text-anchor="start">))) ESP-NOW</text>
<circle cx="320" cy="310" r="2.8" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="327" y="314" class="p" text-anchor="start">GPIO3</text>
<polyline points="320,310 260,310" class="w sig"/>
<path d="M160,310 H190.0 M230.0,310 H260" class="c"/>
<circle cx="190.0" cy="310" r="2.5" fill="#222"/><circle cx="230.0" cy="310" r="2.5" fill="#222"/>
<path d="M188.0,301 H232.0 M210.0,301 V293 M204.0,293 h12" class="c"/>
<text x="210.0" y="332" class="p" text-anchor="middle">Push button: group,</text>
<text x="210.0" y="346" class="p" text-anchor="middle">hold 2 s = undo</text>
<polyline points="160,310 100,310" class="w gnd"/>
<path d="M100,310 v10 M90,320 h20 M94,325 h12 M97.5,330 h5" class="c"/>
<circle cx="320" cy="370" r="2.8" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="327" y="374" class="p" text-anchor="start">GND</text>
<polyline points="320,370 290,370 290,380" class="w gnd"/>
<path d="M290,380 v10 M280,390 h20 M284,395 h12 M287.5,400 h5" class="c"/>
<circle cx="540" cy="290" r="2.8" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="533" y="294" class="p" text-anchor="end">3V3</text>
<circle cx="540" cy="330" r="2.8" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="533" y="334" class="p" text-anchor="end">GPIO4</text>
<circle cx="540" cy="370" r="2.8" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="533" y="374" class="p" text-anchor="end">GND</text>
<rect x="680" y="230" width="200" height="160" rx="6" class="dev"/>
<text x="780.0" y="252" class="t" text-anchor="middle">PIR sensor</text>
<text x="780.0" y="269" class="s" text-anchor="middle">AM312 (optional)</text>
<text x="780.0" y="284" class="s" text-anchor="middle">USE_SENSOR = true</text>
<circle cx="680" cy="290" r="2.8" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="687" y="294" class="p" text-anchor="start">VCC</text>
<circle cx="680" cy="330" r="2.8" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="687" y="334" class="p" text-anchor="start">OUT</text>
<circle cx="680" cy="370" r="2.8" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="687" y="374" class="p" text-anchor="start">GND</text>
<polyline points="540,290 680,290" class="w v33"/>
<polyline points="540,330 680,330" class="w sig"/>
<polyline points="540,370 680,370" class="w gnd"/>
</g>
<polyline points="40,460 74,460" class="w v5"/>
<text x="84" y="464" class="p" text-anchor="start">USB 5 V</text>
<polyline points="40,480 74,480" class="w v33"/>
<text x="84" y="484" class="p" text-anchor="start">+3.3 V</text>
<polyline points="40,500 74,500" class="w sig"/>
<text x="84" y="504" class="p" text-anchor="start">logic signal</text>
<polyline points="40,520 74,520" class="w gnd"/>
<text x="84" y="524" class="p" text-anchor="start">ground</text>
<text x="300" y="464" class="p" text-anchor="start">Mount where the LED still blips reliably; RSSI above about −85 dBm on the page is safe.</text>
<text x="300" y="484" class="p" text-anchor="start">Board with an external antenna connector helps range. SuperMini boards:</text>
<text x="300" y="504" class="p" text-anchor="start">set TX_POWER to WIFI_POWER_8_5dBm on both nodes.</text>
</svg>
